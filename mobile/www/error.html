<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>No signal</title>
  <style>
    html, body { margin: 0; height: 100%; background: #09090b; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%; }
    body { display: flex; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      box-sizing: border-box; }
    main { width: 100%; max-width: 360px; text-align: center; }
    .mark { width: 56px; height: 56px; margin: 0 auto 28px; border-radius: 16px;
      background: rgba(217, 119, 6, .14); display: flex; align-items: center; justify-content: center; }
    .mark svg { width: 28px; height: 28px; }
    h1 { font-size: 26px; line-height: 1.2; margin: 0 0 12px; font-weight: 700; }
    p { font-size: 17px; line-height: 1.5; margin: 0 0 36px; color: #d4d4d8; }
    button { width: 100%; min-height: 56px; border: 0; border-radius: 14px;
      background: #d97706; color: #09090b; font-size: 18px; font-weight: 700;
      font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:active { background: #b45309; }
    .status { margin-top: 18px; font-size: 14px; color: #a1a1aa; min-height: 20px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 2l20 20"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/>
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/>
        <path d="M5 13a10 10 0 0 1 5.24-2.76"/><path d="M12 20h.01"/>
      </svg>
    </div>
    <h1>No signal right now.</h1>
    <p>Anything you already logged is saved on this phone and sends when you're back online.</p>
    <button id="retry" type="button">Try again</button>
    <div class="status" id="status" aria-live="polite"></div>
  </main>
  <script>
    (function () {
      var APP = 'https://controlaos.app';
      var status = document.getElementById('status');
      function go() {
        status.textContent = 'Trying…';
        window.location.href = APP;
      }
      document.getElementById('retry').addEventListener('click', go);
      // Back online: go straight away.
      window.addEventListener('online', go);
      // While online (e.g. signal flickered), retry every 10 seconds.
      setInterval(function () {
        if (navigator.onLine) go();
        else status.textContent = 'Waiting for signal…';
      }, 10000);
      if (!navigator.onLine) status.textContent = 'Waiting for signal…';
    })();
  </script>
</body>
</html>
